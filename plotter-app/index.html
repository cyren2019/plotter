<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plotter</title>
  <style>
    :root {
      --accent: #3b82f6;
      --accent-bg: #eff6ff;
      --accent-border: #bfdbfe;
      --text: #374151;
      --text-h: #111827;
      --border: #e5e7eb;
      --bg: #ffffff;
      --sidebar-width: 260px;
    }
    [data-theme="dark"] {
      --text: #d1d5db;
      --text-h: #f9fafb;
      --border: #374151;
      --bg: #111827;
      --accent-bg: #1e3a5f;
      --accent-border: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100vh; position: relative; }

    /* Header */
    header {
      height: 48px; min-height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      z-index: 10;
    }
    header .title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--text-h);
    }
    header .title svg { width: 20px; height: 20px; color: var(--accent); }
    header .actions {
      display: flex; align-items: center; gap: 12px;
    }
    .github-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 6px;
      color: var(--text);
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .github-link:hover {
      color: var(--accent);
      background: var(--accent-bg);
    }
    .version-badge {
      font-size: 11px; font-weight: 500;
      color: var(--text);
      opacity: 0.6;
      flex-shrink: 0;
      cursor: default;
    }
    .version-badge.has-update {
      opacity: 1;
      color: #f59e0b;
      cursor: pointer;
      position: relative;
    }
    .version-badge.has-update::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      margin-left: 4px;
      vertical-align: middle;
      animation: version-pulse 2s infinite;
    }
    @keyframes version-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 6px; border: none;
      background: transparent; color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .theme-toggle:hover {
      color: var(--accent);
      background: var(--accent-bg);
    }
    header .file-name {
      font-size: 12px; color: var(--text); opacity: 0.5;
      max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-align: center;
      flex: 1;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px;
      font-size: 12px; font-weight: 500;
      border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border);
    }
    .btn:active { transform: scale(0.97); }
    .lang-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 6px; border: none;
      background: transparent; color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .lang-link:hover {
      color: var(--accent);
      background: var(--accent-bg);
    }
    #importBtn { min-width: 110px; justify-content: center; }
    #emptyImportBtn { min-width: 110px; justify-content: center; }
    .btn-primary {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn.active {
      background: var(--accent); color: white; border-color: var(--accent);
    }

    /* Error banner */
    .error-banner {
      display: none; align-items: center; justify-content: space-between;
      padding: 8px 16px;
      background: #fef2f2; border-bottom: 1px solid #fecaca;
      flex-shrink: 0; z-index: 10;
    }
    .error-banner .msg {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #b91c1c;
    }
    .error-banner .close {
      background: none; border: none; cursor: pointer;
      color: #f87171; font-size: 16px; line-height: 1;
    }
    .error-banner .close:hover { color: #dc2626; }

    /* Main */
    main {
      display: flex; flex: 1;
      overflow: hidden;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
    }
    .empty-state .icon {
      width: 80px; height: 80px;
      color: var(--accent); opacity: 0.3;
    }
    .empty-state h2 {
      margin: 0;
      font-size: 16px; font-weight: 500; color: var(--text-h);
    }
    .empty-state p {
      margin: 0;
      font-size: 12px; color: var(--text); opacity: 0.4;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      min-width: 10vw;
      max-width: 40vw;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .resizer {
      width: 4px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .resizer:hover, .resizer.dragging {
      background: var(--accent);
    }
    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header .title-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .sidebar-header .title-row svg { width: 16px; height: 16px; color: var(--accent); }
    .sidebar-header .title-row span { font-size: 14px; font-weight: 500; color: var(--text-h); }
    .search-box {
      position: relative; margin-bottom: 8px;
    }
    .search-box input {
      width: 100%; padding: 6px 8px 6px 28px;
      font-size: 12px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent-border); }
    .search-box input::placeholder { color: var(--text); opacity: 0.3; }
    .search-box svg {
      position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; color: var(--text); opacity: 0.35;
    }
    .sidebar-actions {
      display: flex; gap: 8px; margin-bottom: 8px;
    }
    .sidebar-actions .btn { flex: 1; justify-content: center; }
    .sidebar-actions .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .selected-count {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text); opacity: 0.5;
    }
    .selected-count .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 9999px;
      font-size: 10px; font-weight: 500;
      background: var(--accent); color: white;
    }
    .selected-count .badge.empty {
      background: var(--text); opacity: 0.1; color: var(--text);
    }

    .var-list {
      flex: 1; overflow-y: auto; overflow-x: hidden;
    }
    .time-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--accent-bg);
    }
    .time-row svg { width: 14px; height: 14px; color: var(--accent); opacity: 0.8; }
    .time-row .name { font-size: 12px; color: var(--text-h); font-weight: 500; flex: 1; }
    .time-row .tag {
      font-size: 10px; padding: 2px 6px;
      border-radius: 9999px;
      background: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    .time-select {
      flex: 1;
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text-h);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
    .time-select:focus {
      border-color: var(--accent-border);
    }
    .var-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .var-item:hover { background: rgba(128, 128, 128, 0.08); }
    .var-item.selected { background: var(--accent-bg); }
    .var-item .checkbox {
      width: 14px; height: 14px;
      border: 1.5px solid var(--border); border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .var-item:hover .checkbox { border-color: var(--text); opacity: 0.3; }
    .var-item.selected .checkbox {
      background: var(--accent); border-color: var(--accent);
    }
    .var-item.selected .checkbox svg { display: block; }
    .var-item .checkbox svg { display: none; width: 10px; height: 10px; color: white; }
    .var-item .name {
      font-size: 12px; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .var-item.selected .name { color: var(--accent); font-weight: 500; }
    .var-item .dot {
      width: 6px; height: 6px; border-radius: 9999px;
      background: var(--accent); flex-shrink: 0;
    }

    /* Plot area */
    .plot-section {
      flex: 1; display: flex; flex-direction: column;
      min-width: 0;
    }
    .plot-tabs {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .plot-tabs .btn { padding: 6px 12px; }
    .ts-toggle {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
      padding: 2px;
      background: var(--border);
      border-radius: 6px;
    }
    .ts-toggle .btn {
      padding: 4px 10px;
      font-size: 11px;
      border: none;
      background: transparent;
    }
    .ts-toggle .btn.active {
      background: var(--bg);
      color: var(--accent);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .var-limit-toast {
      display: none;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fde68a;
      animation: toastIn 0.2s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .plot-container {
      flex: 1; position: relative; min-height: 0;
      overflow-y: auto;
    }
    .plot-label {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .plot-label span {
      font-size: 12px; font-weight: 500;
      padding: 2px 10px;
      border-radius: 9999px;
      background: var(--accent-bg); color: var(--accent);
      border: 1px solid var(--accent-border);
    }
    #chart { width: 100%; height: 100%; }
    .chart-msg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .chart-msg p {
      padding: 12px 20px;
      border-radius: 8px;
      background: var(--bg); opacity: 0.9;
      border: 1px solid var(--border);
      font-size: 14px; color: var(--text); opacity: 0.6;
      backdrop-filter: blur(4px);
    }

    /* FFT Parameter Panel */
    .fft-panel {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .fft-panel-row {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .fft-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text); white-space: nowrap;
    }
    .fft-label > span:first-child { opacity: 0.7; }
    .fft-num-input {
      width: 80px; padding: 3px 6px; font-size: 11px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); color: var(--text);
      outline: none; font-family: inherit;
    }
    .fft-num-input:focus { border-color: var(--accent-border); }
    .fft-num-input::placeholder { color: var(--text); opacity: 0.3; font-style: italic; }
    .fft-unit-label { font-size: 10px; color: var(--text); opacity: 0.5; margin-left: 2px; }
    .fft-freq-input-group { display: flex; align-items: center; gap: 2px; }
    .fft-nyquist-hint { font-size: 9px; color: var(--text); opacity: 0.4; margin-left: 4px; white-space: nowrap; }
    .fft-segmented {
      display: flex; align-items: center; gap: 0; padding: 2px;
      background: var(--border); border-radius: 5px;
    }
    .fft-seg-btn {
      padding: 3px 8px; font-size: 10px; font-family: inherit;
      border: none; background: transparent; color: var(--text);
      cursor: pointer; border-radius: 4px; transition: all 0.15s; white-space: nowrap;
    }
    .fft-seg-btn:hover { color: var(--accent); }
    .fft-seg-btn.active {
      background: var(--bg); color: var(--accent);
      font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .fft-select {
      padding: 3px 8px; font-size: 11px; font-family: inherit;
      border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg); color: var(--text);
      outline: none; cursor: pointer;
    }
    .fft-select:focus { border-color: var(--accent-border); }

    /* Drag overlay */
    .drag-overlay {
      display: none;
      position: absolute; inset: 0; z-index: 50;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: var(--accent-bg); opacity: 0.9;
      border: 3px dashed var(--accent);
      border-radius: 8px;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }
    .drag-overlay svg { width: 56px; height: 56px; color: var(--accent); }
    .drag-overlay p { font-size: 16px; font-weight: 600; color: var(--accent); }

    input[type="file"] { display: none; }

    /* Binary column indicators */
    .bin-badge {
      font-size: 9px; padding: 1px 5px;
      border-radius: 9999px;
      background: #3b82f6; color: white; font-weight: 500;
      flex-shrink: 0;
    }
    [data-theme="dark"] .bin-badge { background: #2563eb; }
    .bin-toggle {
      padding: 2px 8px; font-size: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text); cursor: pointer;
      border-radius: 9999px; transition: all 0.15s; flex-shrink: 0;
      font-family: inherit; line-height: 1.4;
    }
    .bin-toggle:hover:not(:disabled) { border-color: #3b82f6; color: #3b82f6; }
    .bin-toggle.active { background: #3b82f6; border-color: #3b82f6; color: white; }
    [data-theme="dark"] .bin-toggle.active { background: #2563eb; border-color: #2563eb; }
    .bin-toggle:disabled { opacity: 0.35; cursor: not-allowed; }
    .var-item[data-binary] { background: #eff6ff; }
    [data-theme="dark"] .var-item[data-binary] { background: rgba(59, 130, 246, 0.08); }
    .var-item.bin-active { border-left: 3px solid #3b82f6; background: #eff6ff; }
    [data-theme="dark"] .var-item.bin-active { border-left: 3px solid #2563eb; background: rgba(59, 130, 246, 0.12); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text); opacity: 0.2; }
  </style>
</head>
<body>
  <div id="app">
    <div class="drag-overlay" id="dragOverlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p id="dragHint">释放文件以导入</p>
    </div>

    <header>
      <div class="title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Plotter
      </div>
      <span class="file-name" id="fileName"></span>
      <div class="actions">
        <a href="https://github.com/cyren2019/plotter" target="_blank" class="github-link" title="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <span class="version-badge" id="versionBadge1">v1.1.4</span>
        <button class="theme-toggle" id="themeToggle" title="切换主题">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="lang-link" id="langToggle" title="Switch to English">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        </button>
        <button class="btn btn-primary" id="importBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="importText"> 导入</span>
        </button>
      </div>
    </header>

    <div class="error-banner" id="errorBanner">
      <div class="msg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText"></span>
      </div>
      <button class="close" id="errorClose">&times;</button>
    </div>

    <input type="file" id="fileInput" accept=".csv,.xls,.xlsx,.log,.txt" />

    <main id="mainArea">
      <div class="empty-state" id="emptyState">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <h2 id="emptyTitle">拖放或点击导入数据文件</h2>
        <p id="emptyDesc">支持 CSV、Excel (.xls, .xlsx)、日志 (.log, .txt) 格式</p>
        <button class="btn btn-primary" id="emptyImportBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="emptyImportText"> 选择文件</span>
        </button>
      </div>
    </main>
  </div>
